[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "workgym"
version = "0.1.0"
description = "Gymnasium-style RL environments for real work workflows (stdlib only)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["."]
include = ["workgym*"]
